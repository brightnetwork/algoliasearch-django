[tox]
envlist =
    {py37,py38,py39,py310}-django32
    {py38,py39,py310}-django40
    {py38,py39,py310,py311}-django41
skip_missing_interpreters = True

[gh-actions]
python =
    3.7: py37
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311

[testenv]
deps =
    factory_boy
    django32: Django>=3.2,<3.3
    django40: Django>=4.0,<4.1
    django41: Django>=4.1,<4.2
passenv =
    ALGOLIA*
    TRAVIS*
commands = python runtests.py

[versions]
twine = >=1.13,<2.0
wheel = >=0.34,<1.0

[testenv:coverage]
basepython = python3.8
deps = coverage
passenv =
    ALGOLIA*
    TRAVIS*
commands =
    coverage run --branch --source=algoliasearch_django runtests.py
    coverage report

[testenv:coveralls]
basepython = python3.8
deps =
    coverage
    coveralls
passenv =
    ALGOLIA*
    TRAVIS*
commands =
    coverage run --branch --source=algoliasearch_django runtests.py
    coverage report
    coveralls

[testenv:release]
basepython = python3.8
deps =
    twine {[versions]twine}
    wheel {[versions]wheel}
passenv =
    PYPI_USER
    PYPI_PASSWORD
commands =
    python setup.py sdist bdist_wheel
    twine check dist/*
    twine upload -u {env:PYPI_USER} -p {env:PYPI_PASSWORD} --repository-url https://upload.pypi.org/legacy/ dist/*
