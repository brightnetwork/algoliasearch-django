[tox]
envlist =
    {py310,py311,py312}-django42
    {py310,py311,py312}-django50
    {py310,py311,py312,py313}-django51
skip_missing_interpreters = True

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
deps =
    factory_boy
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
passenv =
    ALGOLIA*
    TRAVIS*
commands = python runtests.py

[versions]
twine = >=1.13,<2.0
wheel = >=0.34,<1.0

[testenv:coverage]
basepython = python3.12
deps = coverage
passenv =
    ALGOLIA*
    TRAVIS*
commands =
    coverage run --branch --source=algoliasearch_django runtests.py
    coverage report

[testenv:coveralls]
basepython = python3.12
deps =
    coverage
    coveralls
passenv =
    ALGOLIA*
    TRAVIS*
commands =
    coverage run --branch --source=algoliasearch_django runtests.py
    coverage report
    coveralls

[testenv:release]
basepython = python3.12
deps =
    twine {[versions]twine}
    wheel {[versions]wheel}
passenv =
    PYPI_USER
    PYPI_PASSWORD
commands =
    python setup.py sdist bdist_wheel
    twine check dist/*
    twine upload -u {env:PYPI_USER} -p {env:PYPI_PASSWORD} --repository-url https://upload.pypi.org/legacy/ dist/*
